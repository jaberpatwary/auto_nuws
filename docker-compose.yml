services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://postgres:postgres@db:5432/bangla_news?sslmode=disable"
      JWT_SECRET: "${JWT_SECRET:-dev-secret-change-me}"
      JWT_EXPIRY: "24h"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GROQ_MODEL: "${GROQ_MODEL:-llama-3.1-8b-instant}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.8-flash}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-openrouter/free}"
      SAMBANOVA_API_KEY: "${SAMBANOVA_API_KEY:-}"
      SAMBANOVA_MODEL: "${SAMBANOVA_MODEL:-Meta-Llama-3.3-70B-Instruct}"
      COHERE_API_KEY: "${COHERE_API_KEY:-}"
      COHERE_MODEL: "${COHERE_MODEL:-command-a-03-2025}"
      CRON_INTERVAL: "10m"
      FEED_WORKER_COUNT: "5"
      APP_ENV: "development"
      ADMIN_DEFAULT_USER: "${ADMIN_DEFAULT_USER:-admin}"
      ADMIN_DEFAULT_PASS: "${ADMIN_DEFAULT_PASS:-admin123}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bangla_news
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
