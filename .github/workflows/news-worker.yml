name: Scheduled News Fetch

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: autonews-news-worker
  cancel-in-progress: false

jobs:
  fetch-news:
    if: ${{ vars.NEWS_WORKER_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: development
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: openrouter/free
      FEED_WORKER_COUNT: '5'
    steps:
      - name: Check required database secret
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Set the DATABASE_URL repository secret before enabling the news worker."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Fetch and store new articles
        run: go run ./cmd/news-worker
